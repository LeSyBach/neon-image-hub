limit_req_zone $binary_remote_addr zone=search:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
    location /internal { return 404; }
    location = /api/search {
        limit_req zone=search burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
